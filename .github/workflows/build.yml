name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache ffmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-out/bin
          key: ffmpeg-${{ hashFiles('ffmpeg/**') }}

      - name: Set up MSYS2
        if: steps.ffcache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffnvcodec-headers
            mingw-w64-ucrt-x86_64-amf-headers

      - name: Build ffmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./ffmpeg/build.sh

      - name: Smoke test ffmpeg
        continue-on-error: true
        shell: pwsh
        run: |
          $ff = 'build/ffmpeg-out/bin/ffmpeg.exe'
          & $ff -hide_banner -filters | Select-String 'gfxcapture|scale_d3d11|ddagrab'
          & $ff -hide_banner -encoders | Select-String 'nvenc|amf|_mf'
          New-Item -ItemType Directory -Force smoke | Out-Null
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=s=1280x720:r=60 -f lavfi -i anullsrc=r=48000:cl=stereo -t 6 `
            -map 0:v -map 1:a -map 1:a -vf format=nv12 -c:v h264_mf -g 60 -c:a aac -f segment -segment_time 2 -segment_format mpegts smoke/seg%03d.ts
          Get-ChildItem smoke
          # the recorder's audio graph, with files standing in for the pipes
          & $ff -hide_banner -loglevel error -f lavfi -i "sine=f=440:r=48000" -ac 2 -t 6 -f f32le smoke/a.raw
          & $ff -hide_banner -loglevel verbose -f f32le -ar 48000 -ac 2 -i smoke/a.raw -f f32le -ar 48000 -ac 2 -i smoke/a.raw `
            -filter_complex "[0:a]asettb=1/48000,asetpts=N,asplit=2[g1][g2];[1:a]asettb=1/48000,asetpts=N,asplit=2[m1][m2];[g1][m1]amix=inputs=2:normalize=0:dropout_transition=0[mix]" `
            -map "[mix]" -map "[g2]" -map "[m2]" -c:a aac -b:a 160k -t 5 -f segment -segment_time 2 -segment_format mpegts smoke/p%03d.ts 2>&1 | Select-String -NotMatch "^\s*$" | Select-Object -Last 40
          Get-ChildItem smoke

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: build/ffmpeg-out/bin/*.exe

  app:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: src/LiteClip/Embedded

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish LiteClip.exe
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev.' + $env:GITHUB_RUN_NUMBER }
          dotnet publish src/LiteClip/LiteClip.csproj -c Release -o out -p:Version=$ver
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item out/LiteClip.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: LiteClip
          path: out/LiteClip.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME out/LiteClip.exe --title "LiteClip $env:GITHUB_REF_NAME" --generate-notes

      - name: Nightly
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>$null
          gh release create nightly out/LiteClip.exe --prerelease --target $env:GITHUB_SHA --title "Nightly build" --notes "Latest build from main ($($env:GITHUB_SHA.Substring(0,7))). Might be rough."
